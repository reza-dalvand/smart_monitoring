{% extends 'school/base_school.html' %}
{% block title %}{{ title }}{% endblock %}
{% block school_content %}
<div class="sc-hero">
    <div class="sc-hero-content">
        <h2><i class="bi bi-journal-plus me-2" style="color: #ffc107;"></i>{{ title }}</h2>
    </div>
</div>
<div class="sc-section">
    <div class="sc-section-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">ذخیره</button>
            <a href="{% url 'school:assistant_classes' %}" class="btn btn-secondary">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
