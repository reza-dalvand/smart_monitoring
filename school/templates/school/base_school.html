{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
:root {
    --sc-primary: #1a237e;
    --sc-secondary: #ffc107;
    --sc-success: #16a34a;
    --sc-danger: #dc2626;
    --sc-warning: #d97706;
    --sc-info: #0284c7;
    --sc-purple: #7c3aed;
}

/* KPI Cards */
.sc-kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
}
.sc-kpi-card {
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    border: 1px solid #edf1f8;
    box-shadow: 0 4px 12px rgba(15,23,42,.04);
    position: relative;
    overflow: hidden;
    transition: all .25s;
}
.sc-kpi-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(15,23,42,.08);
}
.sc-kpi-card::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--sc-primary), var(--sc-secondary));
}
.sc-kpi-card.success::before { background: var(--sc-success); }
.sc-kpi-card.danger::before { background: var(--sc-danger); }
.sc-kpi-card.warning::before { background: var(--sc-warning); }
.sc-kpi-card.info::before { background: var(--sc-info); }
.sc-kpi-card.purple::before { background: var(--sc-purple); }
.sc-kpi-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; margin-bottom: 10px;
}
.sc-kpi-card .sc-kpi-icon { background: rgba(26,35,126,.08); color: var(--sc-primary); }
.sc-kpi-card.success .sc-kpi-icon { background: rgba(22,163,74,.1); color: var(--sc-success); }
.sc-kpi-card.danger .sc-kpi-icon { background: rgba(220,38,38,.1); color: var(--sc-danger); }
.sc-kpi-card.warning .sc-kpi-icon { background: rgba(217,119,6,.1); color: var(--sc-warning); }
.sc-kpi-card.info .sc-kpi-icon { background: rgba(2,132,199,.1); color: var(--sc-info); }
.sc-kpi-card.purple .sc-kpi-icon { background: rgba(124,58,237,.1); color: var(--sc-purple); }
.sc-kpi-value { font-size: 1.7rem; font-weight: 950; color: #17224a; }
.sc-kpi-title { font-size: .78rem; color: #7b8494; font-weight: 700; margin-top: 4px; }
.sc-kpi-null { color: #94a3b8; font-size: .85rem; font-style: italic; }

/* Sections */
.sc-section {
    background: #fff;
    border-radius: 18px;
    border: 1px solid #edf1f8;
    box-shadow: 0 4px 12px rgba(15,23,42,.04);
    overflow: hidden;
    margin-bottom: 20px;
}
.sc-section-header {
    padding: 16px 20px;
    border-bottom: 1px solid #f2f5fa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg,#fff 0%,#fbfcfe 100%);
}
.sc-section-title {
    display: flex; align-items: center; gap: 10px;
    margin: 0; font-size: 1rem; font-weight: 800; color: #17224a;
}
.sc-section-title i { color: var(--sc-secondary); font-size: 1.1rem; }
.sc-section-body { padding: 20px; }

/* Alert Items */
.sc-alert-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px; border-radius: 12px; margin-bottom: 10px;
    border: 1px solid #edf1f8;
}
.sc-alert-item.CRITICAL { background: rgba(220,38,38,.04); border-color: rgba(220,38,38,.2); }
.sc-alert-item.WARNING { background: rgba(217,119,6,.04); border-color: rgba(217,119,6,.2); }
.sc-alert-item.INFO { background: rgba(2,132,199,.04); border-color: rgba(2,132,199,.2); }

/* Tables */
.sc-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.sc-table thead th {
    background: #f8fafd; color: #7b8494; font-size: .75rem; font-weight: 800;
    padding: 12px 14px; border-bottom: 1px solid #e8edf6;
    text-align: right; white-space: nowrap;
}
.sc-table tbody td {
    padding: 12px 14px; border-bottom: 1px solid #f3f6fa;
    color: #3f4a5a; font-size: .85rem;
}
.sc-table tbody tr:hover { background: #fbfcff; }

/* Badges */
.sc-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 8px;
    font-size: .72rem; font-weight: 700;
}
.sc-badge.success { background: rgba(22,163,74,.1); color: #15803d; }
.sc-badge.danger { background: rgba(220,38,38,.1); color: #b91c1c; }
.sc-badge.warning { background: rgba(217,119,6,.1); color: #b45309; }
.sc-badge.info { background: rgba(2,132,199,.1); color: #0369a1; }
.sc-badge.purple { background: rgba(124,58,237,.1); color: #6d28d9; }

/* Chart */
.sc-chart-wrapper { position: relative; width: 100%; height: 300px; }

/* Empty State */
.sc-empty {
    text-align: center; padding: 50px 20px; color: #94a3b8;
}
.sc-empty-icon { font-size: 3rem; opacity: .4; margin-bottom: 12px; }

/* Hero */
.sc-hero {
    background: linear-gradient(135deg, #1a237e 0%, #283593 55%, #1a237e 100%);
    color: #fff; border-radius: 22px; padding: 28px;
    margin-bottom: 24px; position: relative; overflow: hidden;
    box-shadow: 0 15px 35px rgba(26,35,126,.22);
}
.sc-hero::before {
    content: ''; position: absolute; width: 300px; height: 300px;
    border-radius: 50%; background: rgba(255,193,7,.12);
    top: -120px; right: -100px;
}
.sc-hero-content { position: relative; z-index: 1; }
.sc-hero h2 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 900; }
.sc-hero p { margin: 0; opacity: .85; font-size: .9rem; }

/* Progress */
.sc-progress { height: 8px; background: #f2f5fa; border-radius: 999px; overflow: hidden; }
.sc-progress-fill { height: 100%; border-radius: 999px; }
.sc-progress-fill.success { background: linear-gradient(90deg, #22c55e, #16a34a); }
.sc-progress-fill.warning { background: linear-gradient(90deg, #f59e0b, #d97706); }
.sc-progress-fill.danger { background: linear-gradient(90deg, #ef4444, #dc2626); }
.sc-progress-fill.info { background: linear-gradient(90deg, #38bdf8, #0284c7); }

@media (max-width: 767px) {
    .sc-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .sc-hero { padding: 20px; }
}
</style>
{% block school_content %}{% endblock %}
{% endblock %}
