{% extends 'school/base_school.html' %}
{% block title %}{{ title }}{% endblock %}
{% block school_content %}
<div class="sc-hero">
    <h2><i class="bi bi-file-earmark-bar-graph me-2" style="color: #ffc107;"></i> {{ title }}</h2>
</div>
<div class="row g-4">
    <div class="col-md-4">
        <div class="sc-section text-center p-4">
            <i class="bi bi-people" style="font-size: 2rem; color: var(--sc-primary);"></i>
            <h5 class="mt-2">گزارش دانش‌آموزان</h5>
            <p class="text-muted">آمار ثبت‌نام و وضعیت تحصیلی</p>
            <button class="btn btn-outline-primary" disabled>به زودی</button>
        </div>
    </div>
    <div class="col-md-4">
        <div class="sc-section text-center p-4">
            <i class="bi bi-person-check" style="font-size: 2rem; color: var(--sc-success);"></i>
            <h5 class="mt-2">گزارش حضور و غیاب</h5>
            <p class="text-muted">روند غیبت‌ها و تاخیرها</p>
            <button class="btn btn-outline-success" disabled>به زودی</button>
        </div>
    </div>
    <div class="col-md-4">
        <div class="sc-section text-center p-4">
            <i class="bi bi-award" style="font-size: 2rem; color: var(--sc-warning);"></i>
            <h5 class="mt-2">گزارش عملکرد تحصیلی</h5>
            <p class="text-muted">مشارکت و پاسخ‌دهی در کلاس‌ها</p>
            <button class="btn btn-outline-warning" disabled>به زودی</button>
        </div>
    </div>
</div>
{% endblock %}
