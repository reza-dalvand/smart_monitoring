{% extends 'student/base_student.html' %}
{% block title %}ثبت درخواست جدید{% endblock %}
{% block content %}
<div class="s-page-title"><i class="bi bi-plus-circle-fill"></i> ثبت درخواست جدید</div>

<div class="s-card" style="max-width:650px;">
    <div class="s-card-header">
        <h6 class="s-card-title"><i class="bi bi-envelope-paper"></i> اطلاعات درخواست</h6>
    </div>
    <div class="s-card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size:.85rem;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2">
                <button type="submit" class="s-btn s-btn-primary">
                    <i class="bi bi-check-circle"></i> ثبت درخواست
                </button>
                <a href="{% url 'student:requests' %}" class="s-btn s-btn-outline">انصراف</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
