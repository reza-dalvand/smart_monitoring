{% extends 'student/base_student.html' %}
{% block title %}درخواست تغییر چهره{% endblock %}
{% block content %}
<div class="s-page-title"><i class="bi bi-arrow-repeat"></i> درخواست تغییر چهره</div>

<div class="s-card" style="max-width:600px;">
    <div class="s-card-body">
        <div class="s-msg warning mb-3">
            <i class="bi bi-info-circle-fill"></i>
            درخواست شما پس از ثبت، توسط مسئول مدرسه بررسی خواهد شد.
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">دلیل درخواست</label>
                {{ form.reason }}
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="s-btn s-btn-primary">
                    <i class="bi bi-check-circle"></i> ثبت درخواست
                </button>
                <a href="{% url 'student:face' %}" class="s-btn s-btn-outline">انصراف</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
