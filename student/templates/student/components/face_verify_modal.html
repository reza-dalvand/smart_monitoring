{% load static %}
<!-- ═══════════════════════════════════════════════════════════ -->
<!--  مودال احراز هویت چهره - منتقل شده از اپ face              -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="modal fade" id="faceVerificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
        <div class="modal-content" style="border: none; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.3);">
            
            <!-- هدر گرادیانت -->
            <div style="background: linear-gradient(135deg, #1a237e 0%, #303f9f 50%, #1a237e 100%); padding: 20px 24px; position: relative; overflow: hidden;">
                <div style="position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; background: rgba(255,193,7,0.15); border-radius: 50%;"></div>
                <div style="position: absolute; bottom: -20px; left: -20px; width: 70px; height: 70px; background: rgba(255,255,255,0.08); border-radius: 50%;"></div>
                <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 44px; height: 44px; background: #ffc107; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-person-check-fill" style="font-size: 1.4rem; color: #1a237e;"></i>
                        </div>
                        <div>
                            <h5 style="margin: 0; color: white; font-size: 1.05rem; font-weight: 800;">احراز هویت چهره</h5>
                            <p style="margin: 0; color: rgba(255,255,255,0.7); font-size: 0.8rem;">پایش هوشمند حضور</p>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="بستن"></button>
                </div>
            </div>
            
            <!-- بدنه مودال -->
            <div class="modal-body" style="padding: 20px; background: #0f172a;">
                <div id="fv-root" style="position: relative;">
                    
                    <!-- ویدیو دوربین -->
                    <div style="position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 8px 32px rgba(0,0,0,0.4);">
                        <video id="fv-video" autoplay playsinline muted
                            style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
                        
                        <!-- کادر راهنمای بیضی -->
                        <div id="fv-guide" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 55%; height: 72%; border: 3px dashed rgba(255,255,255,0.7); border-radius: 50% / 42%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.25); transition: all 0.3s ease; pointer-events: none;"></div>
                        
                        <!-- پوشش لودینگ -->
                        <div id="fv-overlay" style="position: absolute; inset: 0; background: rgba(15,23,42,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; gap: 12px;">
                            <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #ffc107; border-radius: 50%; animation: fv-spin 1s linear infinite;"></div>
                            <span id="fv-overlay-text" style="color: white; font-weight: 700; font-size: 0.9rem;">در حال آماده‌سازی...</span>
                        </div>
                    </div>
                    
                    <!-- پیام وضعیت -->
                    <div id="fv-status" class="fv-message info" style="margin-top: 14px; min-height: 44px; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; text-align: center; background: #1e3a5f; color: #93c5fd;">
                        در حال آماده‌سازی دوربین و مدل تشخیص چهره...
                    </div>
                    
                    <!-- دستورالعمل چالش -->
                    <div id="fv-instruction" class="fv-hidden" style="margin-top: 10px; border-radius: 12px; background: linear-gradient(135deg, rgba(255,193,7,0.15), rgba(255,193,7,0.05)); border: 1px solid rgba(255,193,7,0.3); color: #ffc107; font-weight: 800; font-size: 0.95rem; padding: 12px 16px; display: flex; align-items: center; justify-content: center; text-align: center;">
                        لطفاً صبر کنید
                    </div>
                    
                    <!-- پیشرفت چالش‌ها + تایمر -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
                        <div class="d-inline-flex align-items-center gap-2" id="fv-progress">
                            <span class="fv-dot" style="width: 32px; height: 32px; border-radius: 50%; background: #334155; color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; border: 2px solid transparent; transition: all 0.3s;">۱</span>
                            <span class="fv-dot" style="width: 32px; height: 32px; border-radius: 50%; background: #334155; color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; border: 2px solid transparent; transition: all 0.3s;">۲</span>
                            <span class="fv-dot" style="width: 32px; height: 32px; border-radius: 50%; background: #334155; color: #94a3b8; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; border: 2px solid transparent; transition: all 0.3s;">۳</span>
                        </div>
                        <div id="fv-timer" style="font-size: 1.3rem; font-weight: 950; color: white; font-family: 'Courier New', monospace; direction: ltr;">--:--</div>
                    </div>
                    
                    <!-- نتیجه نهایی -->
                    <div id="fv-result" class="fv-result-card" style="display: none; margin-top: 16px; border-radius: 16px; padding: 24px; text-align: center;">
                        <div class="fv-result-icon" id="fv-result-icon" style="font-size: 2.8rem; margin-bottom: 10px;"></div>
                        <div class="fv-result-title" id="fv-result-title" style="font-size: 1.15rem; font-weight: 900; margin-bottom: 6px;"></div>
                        <div class="fv-result-message" id="fv-result-message" style="color: #94a3b8; font-size: 0.88rem; line-height: 1.7;"></div>
                        <div class="mt-3 d-flex gap-2 justify-content-center">
                            <button type="button" class="btn btn-sm btn-outline-light" data-bs-dismiss="modal">بستن</button>
                            <button type="button" id="fv-retry" class="btn btn-sm btn-warning fv-hidden">تلاش مجدد</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- استایل‌های مودال -->
<style>
@keyframes fv-spin { to { transform: rotate(360deg); } }

#fv-guide.green {
    border-color: #22c55e !important;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.15), 0 0 30px rgba(34,197,94,0.5) !important;
}
#fv-guide.red {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.15), 0 0 30px rgba(239,68,68,0.5) !important;
}
#fv-guide.warning {
    border-color: #f59e0b !important;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.15), 0 0 30px rgba(245,158,11,0.5) !important;
}

.fv-message.info { background: #1e3a5f !important; color: #93c5fd !important; }
.fv-message.success { background: #064e3b !important; color: #6ee7b7 !important; }
.fv-message.danger { background: #7f1d1d !important; color: #fca5a5 !important; }
.fv-message.warning { background: #78350f !important; color: #fcd34d !important; }

.fv-hidden { display: none !important; }

#fv-progress .fv-dot.active {
    border-color: #ffc107 !important;
    color: #ffc107 !important;
    background: rgba(255,193,7,0.15) !important;
    transform: scale(1.15);
}
#fv-progress .fv-dot.done {
    background: #16a34a !important;
    color: white !important;
    border-color: #16a34a !important;
}

.fv-result-card.success {
    background: rgba(22, 163, 74, 0.12) !important;
    border: 1px solid rgba(22, 163, 74, 0.3) !important;
}
.fv-result-card.success .fv-result-icon { color: #22c55e !important; }
.fv-result-card.success .fv-result-title { color: #6ee7b7 !important; }

.fv-result-card.error {
    background: rgba(220, 38, 38, 0.1) !important;
    border: 1px solid rgba(220, 38, 38, 0.3) !important;
}
.fv-result-card.error .fv-result-icon { color: #ef4444 !important; }
.fv-result-card.error .fv-result-title { color: #fca5a5 !important; }
</style>
