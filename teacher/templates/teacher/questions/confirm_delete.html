{% extends 'teacher/base_teacher.html' %}
{% block title %}حذف سوال{% endblock %}

{% block content %}
<div class="t-page-header">
    <div class="t-page-title"><i class="bi bi-trash-fill" style="color:var(--t-danger);"></i> حذف سوال</div>
</div>

<div class="t-card" style="max-width:550px;margin:0 auto;">
    <div class="t-card-body text-center">
        <div class="t-empty-icon" style="background:rgba(220,38,38,.08);color:var(--t-danger);">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h5 class="fw-bold mb-2">آیا مطمئن هستید؟</h5>
        <p class="text-muted mb-3">این عملیات قابل بازگشت نیست.</p>

        <div class="p-3 rounded-3 text-right mb-4" style="background:#fef2f2;border:1px solid #fee2e2;">
            <small class="text-danger fw-bold d-block mb-1">سوال #{{ question.id }}</small>
            <span style="font-size:.9rem;">{{ question.text|truncatechars:150 }}</span>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
                <button type="submit" class="t-btn t-btn-danger">
                    <i class="bi bi-trash-fill"></i> بله، حذف شود
                </button>
                <a href="{% url 'teacher:questions' %}" class="t-btn t-btn-outline">انصراف</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
