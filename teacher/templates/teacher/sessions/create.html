{% extends 'teacher/base_teacher.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="t-page-header">
    <div class="t-page-title"><i class="bi bi-plus-circle-fill"></i> ایجاد جلسه جدید</div>
</div>

<div class="t-card" style="max-width:700px;margin:0 auto;">
    <div class="t-card-header">
        <h6 class="t-card-title"><i class="bi bi-calendar-event"></i> اطلاعات جلسه</h6>
    </div>
    <div class="t-card-body">
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="t-form-label">کلاس <span class="text-danger">*</span></label>
                <select name="classroom" class="t-form-control" required>
                    <option value="">انتخاب کلاس...</option>
                    {% for classroom in classrooms %}
                    <option value="{{ classroom.id }}">{{ classroom.name }} - {{ classroom.subject }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="t-form-label">موضوع جلسه</label>
                <input type="text" name="topic" class="t-form-control"
                       placeholder="مثال: جلسه سوم - معادلات درجه دوم">
            </div>

            <div class="mb-3">
                <label class="t-form-label">اهداف یادگیری</label>
                <textarea name="objectives" class="t-form-control" rows="3"
                          placeholder="دانش‌آموز در پایان این جلسه باید بتواند..."></textarea>
            </div>

            <div class="mb-4">
                <label class="t-form-label">توضیحات</label>
                <textarea name="description" class="t-form-control" rows="2"
                          placeholder="توضیحات اضافی (اختیاری)"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="t-btn t-btn-primary flex-grow-1 justify-content-center">
                    <i class="bi bi-check-circle"></i> ایجاد جلسه
                </button>
                <a href="{% url 'teacher:sessions' %}" class="t-btn t-btn-outline">انصراف</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
